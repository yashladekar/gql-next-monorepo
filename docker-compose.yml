services:
  postgres:
    image: postgres:16-alpine
    container_name: fgac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fgac
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    container_name: fgac-openfga-migrate
    command: migrate
    environment: &fga_env
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:postgres@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    container_name: fgac-openfga
    command: run
    restart: unless-stopped
    environment:
      <<: *fga_env
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "3001:3001"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
